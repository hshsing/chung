<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>系統服務入口</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      padding: 24px;
    }
    .box {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }
    .icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.15rem;
      color: #0f172a;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p {
      font-size: 0.92rem;
      color: #64748b;
      line-height: 1.6;
    }
    .eco-line {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      font-size: 0.95rem;
      color: #334155;
      font-weight: 600;
    }
    .eco-line a {
      color: #ea580c;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .eco-line a:hover {
      color: #c2410c;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🔗</div>
    <h1>請透過專屬連結進入</h1>
    <p>本網站各教學與業務系統皆採用獨立網址，請使用教師或單位提供之完整網址開啟對應頁面。</p>
    <p class="eco-line">經濟解題網址請點：<a href="/eco">https://hshsing.pages.dev/eco</a></p>
  </div>
</body>
</html>
